[project]
name = "xtr-scheduler"
version = "3.0.0"
description = "Recurring messages on xtr-messenger: cron and periodic triggers, catch-up after downtime, locks and saved state across restarts."
readme = "README.md"
authors = [
    { name = "Xterr", email = "me@xterr.dev" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["scheduler", "cron", "recurring", "periodic", "messenger", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "typing-extensions>=4.4",
    "xtr-cache-contracts>=3.0,<4",
    "xtr-clock>=3.0,<4",
    # The implementation too, not only the contracts: a schedule keeps its own
    # before/after/failure listeners on an EventDispatcher, and the listener
    # announcing runs is an EventSubscriberInterface, which only it defines.
    "xtr-event-dispatcher>=3.0,<4",
    "xtr-event-dispatcher-contracts>=3.0,<4",
    "xtr-lock>=3.0,<4",
    "xtr-messenger>=3.0,<4",
    "xtr-service-contracts>=3.0,<4",
]

[project.optional-dependencies]
cron = [
    "croniter>=6.2.4,<7",
]
di = [
    "xtr-dependency-injection>=3.0,<4",
]
console = [
    "xtr-console>=3.0,<4",
]
cache = [
    "xtr-cache>=3.0,<4",
]

# The scheduler's transport, for applications without a container: the
# schedule:// scheme serves the schedules declared with @as_schedule and the
# task decorators.
[project.entry-points."xtr_messenger.transport_factories"]
schedule = "xtr_scheduler.messenger.scheduler_transport_factory:SchedulerTransportFactory"

# Advertises the bundle so debug:bundles can name it when installed but not listed.
# Advertising activates nothing: an application lists the bundles it wants.
[project.entry-points."xtr_dependency_injection.bundles"]
scheduler = "xtr_scheduler.bundle:SchedulerBundle"

# Advertises the recipe — what *Use in an application* takes — for recipes:sync.
[project.entry-points."xtr_recipes"]
scheduler = "xtr_scheduler.recipe"

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4.0",
    "ty>=0.0.83",
    "croniter>=6.2.4,<7",
    "types-croniter>=6.0",
    "xtr-cache>=3.0,<4",
    "xtr-console>=3.0,<4",
    "xtr-dependency-injection>=3.0,<4",
    "xtr-logging>=3.0,<4",
    "xtr-service-contracts>=3.0,<4",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# ─────────────────────────────────────────────────────────────────
# basedpyright — typeCheckingMode = "all" sets every report flag to error
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]

reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# An error message long enough to be useful has to wrap, and a 100-column
# limit puts the break inside the string.
reportImplicitStringConcatenation = "none"

# A schedule provider hands over a Schedule, and a Schedule is a schedule
# provider; the events carry the provider. The imports are TYPE_CHECKING-only,
# so the cycle exists only in the static graph, never at runtime.
[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_scheduler/schedule_provider_interface.py"
reportImportCycles = "none"

[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_scheduler/schedule.py"
reportImportCycles = "none"

[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_scheduler/event"
reportImportCycles = "none"

# Tests check state a class keeps to itself, for the same reason ruff's
# SLF001 is off for tests.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "none"

# ─────────────────────────────────────────────────────────────────
# ruff — select = ["ALL"], minimal justified ignores
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (ruff documents these)
    "COM812",
    "ISC001",
    # Mutually-exclusive docstring conventions; keep the modern one
    "D203",
    "D213",
    # Project-specific noise
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Exceptions compose their own messages; the string at a raise site is the reason.
    "TRY003",
    "EM101",
    "EM102",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# The bundle registers factory functions whose signatures the container reads
# at runtime; deferring these would register the factories under nothing.
"src/xtr_scheduler/bundle/*.py" = ["TC001", "TC002", "TC003"]
# A container builds these from their constructors' annotations, and the bus
# reads a handler's __call__ to know what it handles; both are read at runtime.
"src/xtr_scheduler/event_listener/*.py" = ["TC001", "TC002", "TC003"]
"src/xtr_scheduler/messenger/service_call_message_handler.py" = ["TC001"]
# xtr-console reads a command's annotations at runtime.
"src/xtr_scheduler/command/*.py" = ["TC001", "TC002", "TC003"]
# Fixture applications are scanned by a container, which reads their
# annotations at runtime to build services and find what listeners hear.
"tests/fixtures/**/*.py" = ["TC001", "TC002", "TC003", "S101", "D"]
"tests/**/*.py" = [
    "S101",    # assert is the point of pytest
    "ARG",     # fixtures look unused
    "PLR2004", # magic numbers in test data
    "SLF001",  # tests reach into privates
    "D",       # test names are the docs
    "FBT003",  # a scripted outcome is a value, not a flag
    "DTZ001",  # every datetime in the tests is built aware, through a helper
    "S311",    # seeded generators make jitter reproducible; nothing here is secret
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Stamp and message dataclasses are introspected at runtime, so their field
# imports must stay out of TYPE_CHECKING blocks.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# ty — a second opinion on the source
# ─────────────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src", "tests"]

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# CI runs the tests with --cov; a change taking coverage below this fails there.
fail_under = 96
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]
