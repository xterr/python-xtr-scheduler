# The recipe for xtr-scheduler: what *Use in an application* in the README
# takes, as data. Keep the two in step — the README is the source.

[bundles]
# "<module>:<class>" = the environments it is listed with, exactly as in BUNDLES.
# It brings the messenger bundle with it, because a schedule is sent through it.
"xtr_scheduler.bundle:SchedulerBundle" = { all = true }

[files]
# Destination under the application package = template under this recipe.
# The bundle's own defaults written out — every task on a plain "default"
# schedule, keeping no state and taking no lock (see [notes] for one that
# resumes after a restart) — as the place to change how messages are handed over.
"config/packages/scheduler.py" = "files/config/scheduler.py.tmpl"

# No [env], and nothing to ignore.

[gitignore]
lines = []

[notes]
steps = [
  "Declare the recurring work with @as_cron_task / @as_periodic_task: an empty schedule has nothing to send.",
  "For a schedule that resumes after a restart and sends each run once, copy the starter schedule from the README into <app>/schedule.py, and activate the cache and lock bundles it asks for.",
]
check = ["<script> debug:scheduler — each schedule, with every message's next run"]
run = ["<script> messenger:consume scheduler_default"]
